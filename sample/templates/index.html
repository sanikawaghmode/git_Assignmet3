<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

</head>
<body>

<h2>Login Form</h2>

{% with messages = get_flashed_messages() %}
    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}
{% endwith %}

<form method="POST">

    <label>Username:</label>
    <input type="text" name="username">
    <br><br>

    <label>Password:</label>
    <input type="password" name="password">
    <br><br>

    <input type="submit" value="Login">

</form>

</body>
</html>
