<!DOCTYPE html>
<html>
<head>
    <title>Age Calculator</title>
</head>
<body>

<h2>Age Calculator</h2>

{% with messages = get_flashed_messages() %}
    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}
{% endwith %}

<form method="POST">

    Name:
    <input type="text" name="name">
    <br><br>

    Birth Year:
    <input type="number" name="birth_year">
    <br><br>

    <input type="submit" value="Calculate Age">

</form>

</body>
</html>
